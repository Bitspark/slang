name: slang
x-service: &service
  restart: unless-stopped
  networks: [backend]
  read_only: true
  tmpfs: ['/tmp:size=32m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 192m
  volumes: [/srv/slang/secrets/jwt-public.pem:/run/keys/jwt-public.pem:ro]
  logging:
    driver: local
    options: {max-size: 10m, max-file: '3'}
services:
  auth:
    <<: *service
    networks: [backend, gateway]
    image: slang-auth:working
    env_file: [/srv/slang/auth.env]
    mem_limit: 640m
    ports: [127.0.0.1:8201:8080]
    volumes:
      - /srv/slang/secrets/jwt-public.pem:/run/keys/jwt-public.pem:ro
      - /srv/slang/secrets/jwt-private.pem:/run/signing/jwt-private.pem:ro
  auth-producer:
    <<: *service
    image: slang-auth:working
    env_file: [/srv/slang/auth.env]
    command: [python, producer.py]
  repo:
    <<: *service
    networks: [backend, gateway]
    image: slang-repo:working
    env_file: [/srv/slang/repo.env]
    ports: [127.0.0.1:8202:8080]
  repo-producer:
    <<: *service
    image: slang-repo:working
    env_file: [/srv/slang/repo.env]
    command: [python, producer.py]
  meta:
    <<: *service
    networks: [backend, gateway]
    image: slang-meta:working
    env_file: [/srv/slang/meta.env]
    ports: [127.0.0.1:8203:8080]
  usage:
    <<: *service
    networks: [backend, gateway]
    image: slang-usage:working
    env_file: [/srv/slang/usage.env]
    ports: [127.0.0.1:8204:8080]
  usage-consumer:
    <<: *service
    image: slang-usage:working
    env_file: [/srv/slang/usage.env]
    command: [python, consumer.py]
  customer:
    <<: *service
    networks: [backend, gateway]
    image: slang-customer:working
    env_file: [/srv/slang/customer.env]
    ports: [127.0.0.1:8205:8080]
  customer-consumer:
    <<: *service
    image: slang-customer:working
    env_file: [/srv/slang/customer.env]
    command: [python, consumer.py]
  narrow:
    <<: *service
    networks: [backend, gateway]
    image: slang-narrow:working
    env_file: [/srv/slang/narrow.env]
    ports: [127.0.0.1:8206:8080]
  narrow-producer:
    <<: *service
    image: slang-narrow:working
    env_file: [/srv/slang/narrow.env]
    command: [python, producer.py]
  deployment:
    <<: *service
    image: slang-deployment:working
    networks: [backend, gateway]
    env_file: [/srv/slang/deployment.env]
    ports: [127.0.0.1:8207:8080]
    volumes: &runtime-volumes
      - /srv/slang/secrets/jwt-public.pem:/run/keys/jwt-public.pem:ro
      - /srv/slang/secrets/runtime-tls/ca.crt:/run/runtime-tls/ca.crt:ro
      - /srv/slang/secrets/runtime-tls/client.crt:/run/runtime-tls/client.crt:ro
      - /srv/slang/secrets/runtime-tls/client.key:/run/runtime-tls/client.key:ro
  deployment-producer:
    <<: *service
    image: slang-deployment:working
    env_file: [/srv/slang/deployment.env]
    command: [python, -m, application.producer]
  deployment-consumer:
    <<: *service
    image: slang-deployment:working
    networks: [backend, gateway]
    env_file: [/srv/slang/deployment.env]
    volumes: *runtime-volumes
    command: [python, -m, application.consumer]
  transit:
    <<: *service
    image: slang-transit:working
    networks: [backend, gateway]
    env_file: [/srv/slang/meta.env]
    volumes: *runtime-volumes
    command: [python, consumer.py]
  search:
    <<: *service
    image: slang-search:working
    networks: [backend, gateway]
    env_file: [/srv/slang/search.env]
    ports: [127.0.0.1:8208:8080]
  vision:
    <<: *service
    image: slang-vision:working
    networks: [backend, gateway]
    env_file: [/srv/slang/vision.env]
    ports: [127.0.0.1:8209:8080]
  vision-consumer:
    <<: *service
    image: slang-vision:working
    networks: [backend, render]
    env_file: [/srv/slang/vision.env]
    command: [python, consumer.py]
  vision-renderer:
    <<: *service
    image: slang-vision-renderer:working
    networks: [render]
    volumes: []
    environment:
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
    mem_limit: 640m
    pids_limit: 128
    tmpfs: ['/tmp:size=128m,mode=1777']
networks:
  render:
    name: slang-render
    internal: true
  gateway:
    name: slang-gateway
  backend:
    external: true
    name: slang-backend
