name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GO_VERSION: '1.26.7'

jobs:
  cloud:
    name: Cloud deployment source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m compileall -q deploy/cloud
      - run: python3 -m pip install -r deploy/cloud/runtime_requirements.txt
      - run: python3 -m unittest discover -s deploy/cloud/tests -v
      - run: for script in deploy/cloud/*.sh; do sh -n "$script"; done
      - run: git diff --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test -timeout 3m "-coverprofile=coverage.txt" -covermode=atomic ./...
      - run: go build ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.txt
          if-no-files-found: error

  package:
    name: Package releases
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test release tooling
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Test public playground gateway
        run: python3 -m unittest discover -s deploy/public -p 'test_*.py'
      - name: Install optional Windows signing tool
        env:
          B6K_CS_PW: ${{ github.ref_type == 'tag' && secrets.B6K_CS_PW || '' }}
        run: |
          if [[ -n "$B6K_CS_PW" ]]; then
            sudo apt-get update
            sudo apt-get install -y osslsigncode
          fi
      - name: Build archives
        env:
          B6K_CS_PW: ${{ github.ref_type == 'tag' && secrets.B6K_CS_PW || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=v0.0.0-ci
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          python3 ci/build.py "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-archives
          path: ci/release/*
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-archives
          path: release
      - name: Publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
